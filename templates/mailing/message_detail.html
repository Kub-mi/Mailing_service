{% extends "base.html" %}
{% block title %}Сообщение: {{ object.subject }}{% endblock %}
{% block content %}
<h1>{{ object.subject }}</h1>
<pre class="p-3 bg-light border rounded">{{ object.body }}</pre>

<a class="btn btn-outline-secondary" href="{% url 'mailing:message_list' %}">Назад</a>
{% if object.owner_id == user.id %}
  <a class="btn btn-primary" href="{% url 'mailing:message_update' object.pk %}">Изменить</a>
  <a class="btn btn-danger" href="{% url 'mailing:message_delete' object.pk %}">Удалить</a>
{% endif %}
{% endblock %}
