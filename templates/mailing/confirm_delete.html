{% extends "base.html" %}
{% block title %}Удаление{% endblock %}
{% block content %}
<h1>Удалить объект?</h1>
<p>Вы уверены, что хотите удалить <strong>{{ object }}</strong>?</p>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Удалить</button>
  <a class="btn btn-outline-secondary" href="javascript:history.back()">Отмена</a>
</form>
{% endblock %}
