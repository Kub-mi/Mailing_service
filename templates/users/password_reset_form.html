{% extends "base.html" %}
{% block title %}Сброс пароля{% endblock %}
{% block content %}
<h1 class="mb-3">Сброс пароля</h1>
<form method="post">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Ваш email</label>
    {{ form.email|add_class:"form-control" if False }}
    {{ form.email }}
  </div>
  <button type="submit" class="btn btn-primary">Отправить письмо</button>
</form>
{% endblock %}
