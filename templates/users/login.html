{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1 class="mb-3">Вход</h1>
<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <div class="mb-3">
    <label class="form-label">Email</label>
    {{ form.username }}
    <div class="text-danger small">{{ form.username.errors }}</div>
  </div>
  <div class="mb-3">
    <label class="form-label">Пароль</label>
    {{ form.password }}
    <div class="text-danger small">{{ form.password.errors }}</div>
  </div>
  <button class="btn btn-primary" type="submit">Войти</button>
  <a class="btn btn-link" href="{% url 'users:password_reset' %}">Забыли пароль?</a>
  <a class="btn btn-link" href="{% url 'users:register' %}">Регистрация</a>
</form>
{% endblock %}
